[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gliner-clinical-ie"
version = "0.2.0"
description = "Local preprocessing, information extraction, and hybrid classification library for Vietnamese clinical NLP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyYAML>=6.0,<7",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "lightgbm>=4.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
vision = [
  "torch==2.13.0",
  "torchvision==0.28.0",
  "Pillow==12.3.0",
]
inference = [
  "gliner==0.2.27",
  "torch>=2.2,<3",
  "transformers>=4.48,<5",
  "sentencepiece>=0.1.99",
]

[project.scripts]
clinical-ie = "clinical_ie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clinical_ie" = ["resources/*.yaml"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
